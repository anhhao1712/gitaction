name: Microservices CI demo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-test:
    name: Unit test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python and cache pip downloads
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test tools
        run: python -m pip install -r requirements-dev.txt
      - name: Run unit tests and collect coverage
        run: |
          python -m coverage run --source=services -m unittest discover -s tests -v
          python -m coverage xml -o coverage.xml
          python -m coverage report
      - name: Save coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

  quality-check:
    name: Coverage and optional SonarQube
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
      - name: Explain SonarQube mode
        if: vars.ENABLE_SONAR != 'true'
        run: echo "SonarQube is disabled. Set ENABLE_SONAR=true and configure the Sonar variables and secret to enable it."
      - name: Check SonarQube configuration
        if: vars.ENABLE_SONAR == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          test -n "$SONAR_TOKEN" || { echo 'Missing SONAR_TOKEN secret'; exit 1; }
          test -n "$SONAR_HOST_URL" || { echo 'Missing SONAR_HOST_URL variable'; exit 1; }
          test -n "$SONAR_PROJECT_KEY" || { echo 'Missing SONAR_PROJECT_KEY variable'; exit 1; }
          test -n "$SONAR_ORGANIZATION" || { echo 'Missing SONAR_ORGANIZATION variable'; exit 1; }
      - name: Analyze and wait for Quality Gate
        if: vars.ENABLE_SONAR == 'true'
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  image:
    name: Docker build and Trivy (${{ matrix.service }})
    needs: quality-check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [catalog, orders]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Build image locally
        run: docker build -f services/${{ matrix.service }}/Dockerfile -t ci-demo-${{ matrix.service }}:${{ github.sha }} .
      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ci-demo-${{ matrix.service }}:${{ github.sha }}
          format: table
          # Report-only mode keeps this learning pipeline running to completion.
          # Change to '1' later to block the pipeline when vulnerabilities exist.
          exit-code: '0'
          severity: HIGH,CRITICAL
          vuln-type: os,library
