name: CI and image release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint_backend:
    name: Lint (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        id: install
        working-directory: backend
        run: npm ci

      - name: Lint backend
        id: lint
        working-directory: backend
        run: npm run lint

      - name: Write lint result
        if: always()
        env:
          REPORT_KIND: lint
          COMPONENT: backend
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
        run: node .github/scripts/make-report.mjs

      - name: Upload lint result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report-lint-backend
          path: ci-report-lint-backend.json
          if-no-files-found: warn
          retention-days: 14

  lint_frontend:
    name: Lint (frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        id: install
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        id: lint
        working-directory: frontend
        run: ./node_modules/.bin/eslint src --ext .js,.jsx

      - name: Write lint result
        if: always()
        env:
          REPORT_KIND: lint
          COMPONENT: frontend
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
        run: node .github/scripts/make-report.mjs

      - name: Upload lint result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report-lint-frontend
          path: ci-report-lint-frontend.json
          if-no-files-found: warn
          retention-days: 14

  test_backend:
    name: Test (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        id: install
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        id: test
        working-directory: backend
        env:
          CI: 'true'
        run: npm test -- --runInBand --ci --coverage --coverageReporters=lcov

      - name: Upload backend coverage for SonarQube
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

      - name: Write test result
        if: always()
        env:
          REPORT_KIND: test
          COMPONENT: backend
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: node .github/scripts/make-report.mjs

      - name: Upload test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report-test-backend
          path: ci-report-test-backend.json
          if-no-files-found: warn
          retention-days: 14

  test_frontend:
    name: Test (frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        id: install
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        id: test
        working-directory: frontend
        env:
          CI: 'true'
        run: npm test -- --watch=false --runInBand --coverage --coverageReporters=lcov

      - name: Upload frontend coverage for SonarQube
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

      - name: Write test result
        if: always()
        env:
          REPORT_KIND: test
          COMPONENT: frontend
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: node .github/scripts/make-report.mjs

      - name: Upload test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report-test-frontend
          path: ci-report-test-frontend.json
          if-no-files-found: warn
          retention-days: 14

  sonarqube:
    name: SonarQube Cloud
    needs: [test_backend, test_frontend]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_HOST_URL: https://sonarcloud.io
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage

      - name: Verify settings and prepare SonarQube project
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: node .github/scripts/prepare-sonar.mjs

      - name: Scan code and wait for Quality Gate
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  image-security:
    name: Image security (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    env:
      DOCKER_BUILD_SUMMARY: 'false'
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container image with layer cache
        id: image_build
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.component }}
          load: true
          tags: todo-app-${{ matrix.component }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=todo-app-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=todo-app-${{ matrix.component }},ignore-error=true

      - name: Scan image (High and Critical gate)
        id: scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: todo-app-${{ matrix.component }}:sha-${{ github.sha }}
          format: json
          output: trivy-${{ matrix.component }}.json
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Show vulnerable packages and fixed versions
        if: always()
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          report="trivy-${COMPONENT}.json"
          if [ -f "$report" ]; then
            jq -r '.Results[]? | .Target as $target | .Vulnerabilities[]? | [$target, .VulnerabilityID, .PkgName, .InstalledVersion, (.FixedVersion // "not fixed"), .Severity] | @tsv' "$report" | sort -u
          fi

      - name: Upload Trivy findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.component }}
          path: trivy-${{ matrix.component }}.json
          if-no-files-found: warn
          retention-days: 14

      - name: Save verified image for release
        id: image_save
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          docker save "todo-app-${COMPONENT}:sha-${GITHUB_SHA}" | gzip -1 > "image-${COMPONENT}.tar.gz"

      - name: Upload verified image
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.component }}
          path: image-${{ matrix.component }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Write image result
        if: always()
        env:
          REPORT_KIND: image
          COMPONENT: ${{ matrix.component }}
          BUILD_OUTCOME: ${{ steps.image_build.outcome }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          SAVE_OUTCOME: ${{ steps.image_save.outcome }}
        run: node .github/scripts/make-report.mjs

      - name: Upload image result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report-image-${{ matrix.component }}
          path: ci-report-image-${{ matrix.component }}.json
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish (${{ matrix.component }})
    needs: [lint_backend, lint_frontend, test_backend, test_frontend, sonarqube, image-security]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.lint_backend.result == 'success' && needs.lint_frontend.result == 'success' && needs.test_backend.result == 'success' && needs.test_frontend.result == 'success' && needs.sonarqube.result == 'success' && needs.image-security.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    permissions:
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
      COMPONENT: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@v4

      - name: Start release record
        run: |
          printf '{"component":"%s","image":null,"digest":null}\n' "$COMPONENT" > "release-${COMPONENT}.json"

      - name: Download verified image
        uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.component }}
          path: images/${{ matrix.component }}

      - name: Configure AWS credentials from lab details
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity --query '{Account:Account,Arn:Arn}'

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push verified image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: bash .github/scripts/publish-images.sh

      - name: Upload release record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-result-${{ matrix.component }}
          path: release-${{ matrix.component }}.json
          if-no-files-found: warn
          retention-days: 14

  summary:
    name: Pipeline summary
    needs: [lint_backend, lint_frontend, test_backend, test_frontend, sonarqube, image-security, publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Download component results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: ci-report-*
          path: ci-reports
          merge-multiple: true

      - name: Download release results
        if: needs.publish.result != 'skipped'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: release-result-*
          path: release-results
          merge-multiple: true

      - name: Write run summary
        env:
          GH_TOKEN: ${{ github.token }}
          SONAR_RESULT: ${{ needs.sonarqube.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: node .github/scripts/write-summary.mjs
