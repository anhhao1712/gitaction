apiVersion: v1
kind: Service
metadata:
  name: mongo
  labels:
    app.kubernetes.io/name: todo-mongo
    app.kubernetes.io/part-of: todo-app
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: todo-mongo
  ports:
    - name: mongodb
      port: 27017
      targetPort: mongodb
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  labels:
    app.kubernetes.io/name: todo-mongo
    app.kubernetes.io/part-of: todo-app
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: todo-mongo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: todo-mongo
        app.kubernetes.io/part-of: todo-app
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: mongo
          image: public.ecr.aws/docker/library/mongo:4.2.24
          ports:
            - name: mongodb
              containerPort: 27017
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "mongo --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "mongo --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ebs-sc
        resources:
          requests:
            storage: 4Gi
