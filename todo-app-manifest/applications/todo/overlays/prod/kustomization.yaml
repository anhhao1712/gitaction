apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: todo-prod
resources:
  - ../../base
  - pdb.yaml

configMapGenerator:
  - name: todo-backend-config
    literals:
      - PORT=3000
      - APP_ENV=prod
      - LOG_LEVEL=info
      - MONGODB_URI=mongodb://mongo:27017/TodoAppProd
      - OTEL_SERVICE_NAME=todo-backend
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy.monitoring.svc.cluster.local:4318

replicas:
  - name: backend
    count: 2
  - name: frontend
    count: 2

# Dev và prod đang dùng chung một EKS cluster và cặp ECR -dev do todo-app-infra/lives/dev tạo.
# Khi promote sang prod, giữ nguyên sha-<commit> lấy từ cặp repo -dev; nếu tách lives/prod riêng thì đổi newName sang -prod.
images:
  - name: 425959969184.dkr.ecr.us-east-1.amazonaws.com/todo-app-backend
    newName: 425959969184.dkr.ecr.us-east-1.amazonaws.com/todo-app-backend-dev
    newTag: sha-0000000000000000000000000000000000000000
  - name: 425959969184.dkr.ecr.us-east-1.amazonaws.com/todo-app-frontend
    newName: 425959969184.dkr.ecr.us-east-1.amazonaws.com/todo-app-frontend-dev
    newTag: sha-0000000000000000000000000000000000000000

# Set production MongoDB capacity at creation time and prevent accidental prune deletion.
# For later resizing, expand the bound PVC explicitly; StatefulSet claim templates are immutable.
patches:
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: mongo
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 20Gi
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-options: Delete=false
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
