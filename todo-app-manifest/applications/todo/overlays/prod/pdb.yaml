apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-pdb
  labels:
    app.kubernetes.io/name: todo-backend
    app.kubernetes.io/part-of: todo-app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: todo-backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
  labels:
    app.kubernetes.io/name: todo-frontend
    app.kubernetes.io/part-of: todo-app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: todo-frontend
