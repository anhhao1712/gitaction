apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - datasources.yaml

configMapGenerator:
  - name: grafana-dashboard-todo-app
    files:
      - todo-app.json=dashboards/todo-app.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: "Todo App"

  - name: grafana-dashboard-cluster-overview
    files:
      - cluster-overview.json=dashboards/cluster-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: "Cluster"

  - name: grafana-dashboard-cost-overview
    files:
      - cost-overview.json=dashboards/cost-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: "Cost"
