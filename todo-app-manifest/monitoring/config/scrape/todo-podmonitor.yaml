apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: todo-backend
  namespace: monitoring
  labels:
    app.kubernetes.io/name: todo-backend
    app.kubernetes.io/part-of: todo-app
spec:
  namespaceSelector:
    matchNames:
      - todo-dev
      - todo-prod
  selector:
    matchLabels:
      app.kubernetes.io/name: todo-backend
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
