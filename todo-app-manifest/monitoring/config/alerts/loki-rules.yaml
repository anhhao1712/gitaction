apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-rules-todo
  namespace: monitoring
  labels:
    loki_rule: "1"
  annotations:
    # Với auth_enabled: false, Loki ruler đọc rule theo tenant mặc định "fake" (/rules/fake)
    loki_folder: "fake"
data:
  todo.yaml: |
    groups:
      - name: todo-logs
        rules:
          - alert: TodoBackendErrorLogSpike
            expr: |
              sum by (namespace) (
                count_over_time({namespace=~"todo-.*", app="todo-backend"} |~ "\"level\"\\s*:\\s*\"error\"|ERROR:" [5m])
              ) > 20
            for: 5m
            labels:
              severity: warning
              service: todo-backend
            annotations:
              summary: "Backend {{ $labels.namespace }} ghi hơn 20 log lỗi trong 5 phút"
              description: "Mở Grafana Explore → Loki lọc namespace={{ $labels.namespace }}, app=todo-backend để xem chi tiết."
