# Umbrella values: mỗi top-level key tương ứng với một dependency trong Chart.yaml.

kube-prometheus-stack:
  fullnameOverride: kube-prometheus-stack

  # AWS EKS tự quản lý control plane nên không scrape được từ worker node; tắt để tránh alert giả.
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeProxy:
    enabled: false
  defaultRules:
    rules:
      etcd: false
      kubeControllerManager: false
      kubeSchedulerAlerting: false
      kubeSchedulerRecording: false
      kubeProxy: false

  grafana:
    # Giữ nguyên tên Service để lệnh port-forward trong monitoring/README.md không đổi
    fullnameOverride: kube-prometheus-stack-grafana
    enabled: true
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    service:
      type: ClusterIP
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        searchNamespace: monitoring
        folderAnnotation: grafana_folder
        provider:
          foldersFromFilesStructure: true
      datasources:
        enabled: true
        label: grafana_datasource
        labelValue: "1"
        exemplarTraceIdDestinations:
          datasourceUid: tempo
          traceIdLabelName: trace_id
          urlDisplayLabel: View trace in Tempo
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 300m
        memory: 512Mi

  prometheus:
    prometheusSpec:
      externalLabels:
        cluster_id: todo-app-dev-eks
      retention: 7d
      retentionSize: 6GB
      enableFeatures:
        - exemplar-storage
      # Cho phép Tempo metrics-generator đẩy span metrics & service graph vào Prometheus
      enableRemoteWriteReceiver: true
      # Đọc ServiceMonitor/PodMonitor/PrometheusRule từ monitoring-config không cần label release
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1536Mi
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: ebs-sc
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 8Gi

  alertmanager:
    config:
      templates:
        - /etc/alertmanager/config/*.tmpl
    templateFiles:
      email.tmpl: |
        {{ define "todo.email.html" }}
        <h3>[{{ .Status | toUpper }}] {{ .CommonAnnotations.summary }}</h3>
        <p><b>Severity:</b> {{ .CommonLabels.severity }}</p>
        <p><b>Namespace:</b> {{ .CommonLabels.namespace }}</p>
        <p><b>Service:</b> {{ .CommonLabels.service }}</p>
        <ul>
        {{ range .Alerts }}
          <li>
            <b>{{ .Labels.alertname }}</b> ({{ .Status }}): {{ .Annotations.description }}
          </li>
        {{ end }}
        </ul>
        {{ end }}
    alertmanagerSpec:
      alertmanagerConfigSelector: {}
      # Cho phép AlertmanagerConfig trong namespace monitoring khớp alert từ todo-dev / todo-prod
      alertmanagerConfigMatcherStrategy:
        type: None
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: ebs-sc
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 4Gi

loki:
  fullnameOverride: loki
  deploymentMode: Monolithic
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    limits_config:
      retention_period: 72h
      allow_structured_metadata: true
    compactor:
      working_directory: /var/loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
    rulerConfig:
      enable_api: true
      enable_alertmanager_v2: true
      rule_path: /var/loki/rules-temp
      ring:
        kvstore:
          store: inmemory
      storage:
        type: local
        local:
          directory: /rules
      alertmanager_url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
  singleBinary:
    replicas: 1
    sidecar: true
    persistence:
      enabled: true
      storageClass: ebs-sc
      size: 8Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 768Mi
  sidecar:
    rules:
      enabled: true
      label: loki_rule
      labelValue: "1"
      folder: /rules
      folderAnnotation: loki_folder
      searchNamespace: monitoring
  gateway:
    enabled: true
    replicas: 1
    service:
      type: ClusterIP
  # Tắt cache/canary/test để phù hợp tài nguyên node nhỏ trên EKS
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  lokiCanary:
    enabled: false
  test:
    enabled: false
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0

tempo:
  fullnameOverride: tempo
  replicas: 1
  service:
    type: ClusterIP
  persistence:
    enabled: true
    storageClassName: ebs-sc
    size: 4Gi
  tempo:
    retention: 72h
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    metricsGenerator:
      enabled: true
      remoteWriteUrl: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write
      storage:
        path: /var/tempo/metrics
    overrides:
      defaults:
        metrics_generator:
          processors:
            - service-graphs
            - span-metrics

alloy:
  fullnameOverride: alloy
  controller:
    type: daemonset
  service:
    enabled: true
    type: ClusterIP
  alloy:
    extraEnv:
      - name: NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName
    extraPorts:
      - name: otlp-grpc
        port: 4317
        targetPort: 4317
        protocol: TCP
      - name: otlp-http
        port: 4318
        targetPort: 4318
        protocol: TCP
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
    configMap:
      create: true
      content: |
        logging {
          level  = "info"
          format = "logfmt"
        }

        // 1. Thu logs container trên đúng node của DaemonSet và đẩy về Loki
        discovery.kubernetes "pods" {
          role = "pod"
          selectors {
            role  = "pod"
            field = "spec.nodeName=" + sys.env("NODE_NAME")
          }
        }

        discovery.relabel "pod_logs" {
          targets = discovery.kubernetes.pods.targets

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
            target_label  = "app"
          }
        }

        loki.source.kubernetes "pod_logs" {
          targets    = discovery.relabel.pod_logs.output
          forward_to = [loki.write.default.receiver]
        }

        loki.write "default" {
          endpoint {
            url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
          }
        }

        // 2. Nhận OTLP traces từ ứng dụng, lấy mẫu 100% cho môi trường demo/đồ án (giảm về 10 khi chạy production lưu lượng lớn) và đẩy về Tempo
        otelcol.receiver.otlp "default" {
          grpc {
            endpoint = "0.0.0.0:4317"
          }
          http {
            endpoint = "0.0.0.0:4318"
          }

          output {
            traces = [otelcol.processor.memory_limiter.default.input]
          }
        }

        otelcol.processor.memory_limiter "default" {
          check_interval = "1s"
          limit          = "200MiB"

          output {
            traces = [otelcol.processor.probabilistic_sampler.default.input]
          }
        }

        otelcol.processor.probabilistic_sampler "default" {
          sampling_percentage = 100

          output {
            traces = [otelcol.processor.batch.default.input]
          }
        }

        otelcol.processor.batch "default" {
          output {
            traces = [otelcol.exporter.otlp.tempo.input]
          }
        }

        otelcol.exporter.otlp "tempo" {
          client {
            endpoint = "tempo.monitoring.svc.cluster.local:4317"
            tls {
              insecure = true
            }
          }
        }
