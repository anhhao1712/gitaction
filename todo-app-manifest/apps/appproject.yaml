apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: todo-project
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: GitOps project for the Todo dev and prod workloads.
  sourceRepos:
    - https://github.com/anhhao1712/gitaction.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: todo-dev
    - server: https://kubernetes.default.svc
      namespace: todo-prod
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
