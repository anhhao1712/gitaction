version: '3.8'

services:
  mongo:
    image: mongo:4.2.24
    container_name: todo-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: todo-backend
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/TodoApp
      - PORT=3000
      - APP_ENV=local
      - LOG_LEVEL=debug
      - OTEL_SERVICE_NAME=todo-backend
      - OTEL_SDK_DISABLED=true
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: todo-frontend
    ports:
      - "8080:3000"
    depends_on:
      - backend

volumes:
  mongodata:
